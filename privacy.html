<!doctype html><html lang="ko"><meta charset="utf-8"><title>꾸잉비서 개인정보처리방침</title>
<h1>개인정보처리방침</h1>
<p>꾸잉비서는 운영자 본인만 사용하는 개인용 앱입니다.</p>
<ul>
<li>Google 계정을 연결하면 Google Calendar 일정을 읽기 전용(calendar.readonly)으로 가져옵니다.</li>
<li>가져온 일정은 운영자 본인의 서버에만 저장하며 제3자에게 판매하거나 공유하지 않습니다.</li>
<li>운영자가 고른 캘린더의 일정만, 운영자 본인이 쓰는 AI 비서(OpenAI Codex)에 대화 맥락으로 전달될 수 있습니다.</li>
<li>Google 계정 설정(보안 → 타사 앱 액세스)에서 언제든 연결을 해제할 수 있습니다.</li>
</ul>
</html>
